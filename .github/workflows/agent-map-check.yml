name: agent-map-check

# Verifies that links inside the agentic framework (AGENTS.md, CLAUDE.md,
# agentic/**, docs/**, apps/**) still resolve. Catches drift when docs
# or repo structure move. Markdown-link based; fast and cheap to run.

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "agentic/**"
      - "docs/**"
      - ".agents/**"
      - ".github/workflows/agent-map-check.yml"
      - "scripts/check-agent-map.sh"
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify agentic framework links
        run: bash scripts/check-agent-map.sh
