name: secret-scan

# Enforces Hard Gate: ZERO SECRET LEAKS (PROJECT_GOD.md)
# Rejects any PR or push that attempts to introduce API keys, private keys, or credentials into tracked code.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Secret Leak Scan
        run: bash scripts/check-secrets.sh
