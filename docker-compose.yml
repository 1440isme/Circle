services:
  postgres:
    image: postgres:16-alpine
    container_name: circle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-circle_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - circle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-circle_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - circle-network

  redis:
    image: redis:7-alpine
    container_name: circle-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - circle_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - circle-network

volumes:
  circle_pgdata:
    name: circle_pgdata
  circle_redisdata:
    name: circle_redisdata

networks:
  circle-network:
    name: circle-network
    driver: bridge
